<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wan2.2 Video Studio</title>
<style>
  body { background:#0b0b0f; color:#eee; font-family: -apple-system, sans-serif; display:flex; justify-content:center; padding-top:80px; }
  .card { background:#16161d; border:1px solid #2a2a35; border-radius:16px; padding:32px; width:360px; text-align:center; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px; }
  .offline { background:#666; }
  .starting { background:#e0a72e; }
  .running { background:#2ecc71; }
  .error { background:#e74c3c; }
  .stopping { background:#e0a72e; }
  button { margin-top:20px; padding:12px 28px; border-radius:10px; border:none; font-size:15px; cursor:pointer; }
  .start-btn { background:#3b82f6; color:white; }
  .stop-btn { background:#e74c3c; color:white; }
  .hint { font-size:12px; color:#666; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <h2>GPU ENGINE</h2>
    <div><span id="status-dot" class="dot offline"></span><span id="status-text">OFFLINE</span></div>
    <div id="btn-area"></div>
    <div class="hint" id="hint-text">Click Start GPU. Once it's ready, you'll be taken to ComfyUI automatically.</div>
  </div>

<script>
const API = "https://wan22-backend-z71g.onrender.com";
let redirected = false;

async function refreshStatus() {
  try {
    const res = await fetch(`${API}/api/gpu/status`);
    const data = await res.json();
    render(data);
  } catch (e) {
    render({status: "ERROR", tunnel_url: null});
  }
}

function render(data) {
  const dot = document.getElementById("status-dot");
  const text = document.getElementById("status-text");
  const btnArea = document.getElementById("btn-area");
  const hint = document.getElementById("hint-text");

  dot.className = "dot " + data.status.toLowerCase();
  text.textContent = data.status;

  if (data.status === "RUNNING") {
    btnArea.innerHTML = '<button class="stop-btn" onclick="stopGpu()">STOP GPU</button>';
    if (data.tunnel_url && !redirected) {
      redirected = true;
      hint.textContent = "ComfyUI is ready -- redirecting now...";
      setTimeout(() => { window.location.href = data.tunnel_url; }, 1500);
    } else if (!data.tunnel_url) {
      hint.textContent = "GPU is up, waiting for ComfyUI to finish starting...";
    }
  } else if (data.status === "STARTING") {
    btnArea.innerHTML = '<button disabled>STARTING...</button>';
    hint.textContent = "Starting GPU, this takes about 4-5 minutes...";
    redirected = false;
  } else {
    btnArea.innerHTML = '<button class="start-btn" onclick="startGpu()">START GPU</button>';
    hint.textContent = "Click Start GPU. Once it's ready, you'll be taken to ComfyUI automatically.";
    redirected = false;
  }
}

async function startGpu() {
  document.getElementById("btn-area").innerHTML = '<button disabled>STARTING...</button>';
  redirected = false;
  await fetch(`${API}/api/gpu/start`, { method: "POST" });
  refreshStatus();
}

async function stopGpu() {
  await fetch(`${API}/api/gpu/stop`, { method: "POST" });
  refreshStatus();
}

refreshStatus();
setInterval(refreshStatus, 8000);
</script>
</body>
</html>
